<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Gallery — visual records of conferences, awards and field work by Jonathan Flores Monroy." />
  <title>Jonathan Flores Monroy · Gallery</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/gallery.css" />
</head>
<body class="theme-dark">

  <!-- ============ NAV ============ -->
  <header class="site-nav">
    <a class="brand" href="index.html">Jonathan Flores <span>PhD · AI</span></a>
    <nav class="nav-links" id="navLinks" aria-label="Primary">
      <a href="index.html#about" data-i18n="nav.about">About</a>
      <a href="research.html" data-i18n="nav.research">Research</a>
      <a href="models.html" data-i18n="nav.models">Models</a>
      <a href="gallery.html" data-i18n="nav.gallery">Gallery</a>
      <a href="index.html#contact" data-i18n="nav.contact">Contact</a>
    </nav>
    <div class="nav-actions">
      <button class="lang-toggle" id="langToggle" type="button" aria-label="Switch language">
        <i data-lucide="languages"></i><span class="lang-current">ES</span>
      </button>
      <button class="nav-burger" id="navBurger" type="button" aria-expanded="false" aria-controls="navLinks" data-i18n-attr="aria-label:nav.menu">
        <i data-lucide="menu"></i>
      </button>
    </div>
  </header>

  <main>
    <header class="gallery-header">
      <div class="container">
        <a class="back-link" href="index.html"><span class="arrow">←</span> <span data-i18n="g.back">Back to home</span></a>
        <h1 class="section-title font-serif" data-i18n="g.title">Trajectory &amp; evidence</h1>
        <p class="section-lead" data-i18n="g.lead">Visual records of international conferences, recognitions and field work.</p>
      </div>
    </header>

    <div class="container">
      <div class="filter-bar" id="galleryFilters">
        <button class="filter-btn is-active" data-filter="all" data-i18n="g.filter.all">All</button>
        <button class="filter-btn" data-filter="conferences" data-i18n="g.filter.conferences">Conferences</button>
        <button class="filter-btn" data-filter="awards" data-i18n="g.filter.awards">Awards</button>
        <button class="filter-btn" data-filter="field" data-i18n="g.filter.field">Field work</button>
      </div>

      <section class="gallery-grid" id="galleryGrid" aria-label="Gallery"><!-- rendered by gallery.js --></section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Jonathan Flores Monroy · <span data-i18n="footer.role">AI Researcher &amp; Engineer</span></p>
      <ul class="footer-links">
        <li><a href="index.html" data-i18n="nav.home">Home</a></li>
        <li><a href="research.html" data-i18n="nav.research">Research</a></li>
      </ul>
    </div>
  </footer>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
